apiVersion: apps/v1
kind: Deployment
metadata:
  name: temp-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temp-app
  template:
    metadata:
      labels:
        app: temp-app
    spec:
      containers:
        - name: temp-container1
          image: srihareeshh/temp-container1:v1 
          ports:
            - containerPort: 5000
          stdin: true
          tty: true

---
apiVersion: v1
kind: Service
metadata:
  name: temp-service
spec:
  type: NodePort
  selector:
    app: temp-app
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
